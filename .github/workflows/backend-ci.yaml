name: CI/CD Arena UFRN

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'

  pull_request:
    branches:
      - main

jobs:
  test-and-sonar:
    name: CI — Lint, Unidade, Integração, Cobertura e SonarQube

    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: arena
          POSTGRES_PASSWORD: arena_ci_password
          POSTGRES_DB: arena_ufrn_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
          cache: pnpm
          cache-dependency-path: |
            backend/pnpm-lock.yaml
            frontend/pnpm-lock.yaml

      - name: Instalar dependências do backend
        working-directory: backend
        run: pnpm install --frozen-lockfile

      - name: Instalar dependências do frontend
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Checagem estática do backend
        working-directory: backend
        run: |
          node --check server.js
          find src -type f -name '*.js' -exec node --check {} \;

      - name: Lint e build do frontend
        working-directory: frontend
        run: |
          pnpm lint
          pnpm build

      - name: Gerar Prisma Client
        working-directory: backend
        run: pnpm prisma generate --config prisma7.config.ts
        env:
          DATABASE_URL: postgresql://arena:arena_ci_password@localhost:5432/arena_ufrn_test

      - name: Executar testes unitários
        working-directory: backend
        run: pnpm test:unit
        env:
          NODE_ENV: test
          JWT_SECRET: ci-test-secret-arena-ufrn-2026-32-chars

      - name: Executar testes de integração
        working-directory: backend
        run: pnpm test:integration
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://arena:arena_ci_password@localhost:5432/arena_ufrn_test
          TEST_DATABASE_URL: postgresql://arena:arena_ci_password@localhost:5432/arena_ufrn_test
          JWT_SECRET: ci-test-secret-arena-ufrn-2026-32-chars

      - name: Gerar cobertura
        working-directory: backend
        run: pnpm test:coverage
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://arena:arena_ci_password@localhost:5432/arena_ufrn_test
          TEST_DATABASE_URL: postgresql://arena:arena_ci_password@localhost:5432/arena_ufrn_test
          JWT_SECRET: ci-test-secret-arena-ufrn-2026-32-chars

      - name: Publicar relatório de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-backend
          path: backend/coverage/

      - name: Executar análise SonarQube e aguardar Quality Gate
        uses: SonarSource/sonarqube-scan-action@v7
        with:
          args: >
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  e2e-headless:
    name: CI — Testes de Sistema (E2E Headless)
    needs: test-and-sonar
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: arena
          POSTGRES_PASSWORD: arena_ci_password
          POSTGRES_DB: arena_ufrn_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v6

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
          cache: pnpm
          cache-dependency-path: |
            backend/pnpm-lock.yaml
            frontend/pnpm-lock.yaml

      - name: Instalar dependências do backend e frontend
        run: |
          pnpm --dir backend install --frozen-lockfile
          pnpm --dir frontend install --frozen-lockfile

      - name: Gerar Prisma Client, aplicar migrations e executar seed
        working-directory: backend
        env:
          DATABASE_URL: postgresql://arena:arena_ci_password@localhost:5432/arena_ufrn_e2e?schema=public
        run: |
          pnpm db:generate
          pnpm db:deploy
          pnpm db:seed

      - name: Compilar frontend para o serving estático
        working-directory: frontend
        run: pnpm build

      - name: Executar testes E2E Headless com Firefox + Selenium
        env:
          NODE_ENV: test
          PORT: 3000
          DATABASE_URL: postgresql://arena:arena_ci_password@localhost:5432/arena_ufrn_e2e?schema=public
          JWT_SECRET: ci-e2e-secret-arena-ufrn-2026-32-chars
          SERVE_STATIC: 'true'
          PUBLIC_DIR: ${{ github.workspace }}/frontend/dist
          HEADLESS: 'true'
          BASE_URL: http://localhost:3000
        run: |
          node backend/server.js &
          SERVER_PID=$!
          trap "kill $SERVER_PID 2>/dev/null || true" EXIT

          curl --fail --silent --show-error \
            --retry 30 --retry-delay 1 --retry-connrefused \
            http://localhost:3000/health

          pnpm --dir frontend run test:e2e

  deploy:
    name: CD — Deploy na Render
    needs: [test-and-sonar, e2e-headless]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest

    steps:
      - name: Disparar deploy do commit testado
        env:
          DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL || secrets.RENDER_DEPLOY_HOOK_URN }}
        run: |
          curl --fail --silent --show-error --get \
            --data-urlencode "ref=${{ github.sha }}" \
            "$DEPLOY_HOOK_URL"

  smoke:
    name: CD — Smoke Test pós-deploy
    needs: deploy
    runs-on: ubuntu-latest

    steps:
      - name: Verificar GET /health (servidor + PostgreSQL)
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          RESPONSE=$(curl --fail --silent --show-error \
            --retry 60 --retry-delay 10 --retry-connrefused \
            "$APP_URL/health")
          echo "Resposta /health: $RESPONSE"
          echo "$RESPONSE" | grep -q '"status":"ok"'
          echo "$RESPONSE" | grep -q '"database":"up"'

      - name: Verificar frontend e API de quadras publicados
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          HTML=$(curl --fail --silent --show-error --retry 10 --retry-delay 5 "$APP_URL/")
          echo "$HTML" | grep -qi 'Arena UFRN'
          curl --fail --silent --show-error --retry 10 --retry-delay 5 "$APP_URL/api/quadras" > /dev/null
