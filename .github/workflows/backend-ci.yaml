name: Backend CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test-and-sonar:
    name: Testes, cobertura e análise SonarQube

    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
          cache: pnpm
          cache-dependency-path: |
            backend/pnpm-lock.yaml
            frontend/pnpm-lock.yaml

      - name: Instalar dependências do backend
        working-directory: backend
        run: pnpm install --frozen-lockfile

      - name: Instalar dependências do frontend
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Checagem estática do backend
        working-directory: backend
        run: |
          node --check server.js
          find src -type f -name '*.js' -exec node --check {} \;

      - name: Lint do frontend
        working-directory: frontend
        run: pnpm lint

      - name: Gerar Prisma Client
        working-directory: backend
        run: pnpm prisma generate --config prisma7.config.ts
        env:
          DATABASE_URL: file:./dev.db

      - name: Executar testes unitários
        working-directory: backend
        run: pnpm test:unit

      - name: Executar testes de integração
        working-directory: backend
        run: pnpm test:integration

      - name: Gerar cobertura
        working-directory: backend
        run: pnpm test:coverage

      - name: Publicar relatório de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-backend
          path: backend/coverage/

      - name: Executar análise SonarQube
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  deploy:
    name: Deploy na Render
    needs: test-and-sonar
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Disparar deploy do commit testado
        env:
          DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          curl --fail --silent --show-error --get \
            --data-urlencode "ref=${{ github.sha }}" \
            "$DEPLOY_HOOK_URL"

  smoke:
    name: Smoke test pós-deploy
    needs: deploy
    runs-on: ubuntu-latest

    steps:
      - name: Verificar GET /health na aplicação publicada
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          curl --fail --silent --show-error \
            --retry 60 --retry-delay 10 --retry-connrefused \
            "$APP_URL/health"
